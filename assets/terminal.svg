<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 410" width="860" height="410" role="img" aria-labelledby="t d">
  <title id="t">demetrios@sofia</title>
  <desc id="d">whoami: Demetrios Vlassis, full-stack developer in Sofia. I build and ship fast with AI coding agents, and I do hackathons. Contributions by year: 2022 450, 2023 193, 2024 49, 2025 345, 2026 so far 833. 1,030 in the last 12 months, best day 135.</desc>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 15px; fill: #e6edf3; }
    .muted { fill: #8b949e; }
    .green { fill: #3fb950; }
    .bright { fill: #39d353; font-weight: 700; }
    .title { font-size: 13px; fill: #8b949e; }
    .f { opacity: 0; animation: fade .35s ease forwards; }
    .cov1 { animation: type1 .55s steps(6, end) .5s forwards; }
    .cov2 { animation: type2 1s steps(23, end) 2.1s forwards; }
    .bar { transform-box: fill-box; transform-origin: 0 50%; transform: scaleX(0); animation: grow .9s cubic-bezier(.2,.8,.2,1) forwards; }
    .cur { animation: blink 1s steps(2, start) 6s infinite; }
    @keyframes fade { to { opacity: 1; } }
    @keyframes type1 { to { transform: translateX(54px); } }
    @keyframes type2 { to { transform: translateX(207px); } }
    @keyframes grow { to { transform: scaleX(1); } }
    @keyframes blink { to { visibility: hidden; } }
    @media (prefers-reduced-motion: reduce) {
      .cov1, .cov2 { display: none; }
      .f, .bar, .cur { animation: none; opacity: 1; transform: none; }
    }
  </style>

  <!-- window -->
  <rect x="0.5" y="0.5" width="859" height="409" rx="12" fill="#0d1117" stroke="#30363d"/>
  <path d="M0.5 36 V12.5 A12 12 0 0 1 12.5 0.5 H847.5 A12 12 0 0 1 859.5 12.5 V36 Z" fill="#161b22"/>
  <line x1="0.5" y1="36" x2="859.5" y2="36" stroke="#30363d"/>
  <circle cx="22" cy="18.5" r="6" fill="#ff5f57"/>
  <circle cx="42" cy="18.5" r="6" fill="#febc2e"/>
  <circle cx="62" cy="18.5" r="6" fill="#28c840"/>
  <text x="430" y="23" text-anchor="middle" class="title">demetrios@sofia: ~</text>

  <!-- $ whoami -->
  <text x="24" y="72" class="green">$</text>
  <text x="42" y="72" textLength="54" lengthAdjust="spacing">whoami</text>
  <rect class="cov1" x="42" y="56" width="54" height="22" fill="#0d1117"/>

  <text x="24" y="100" class="f" style="animation-delay:1.25s">Demetrios Vlassis <tspan class="muted">·</tspan> full-stack developer <tspan class="muted">·</tspan> Sofia</text>
  <text x="24" y="126" class="f muted" style="animation-delay:1.5s">I build and ship fast with AI coding agents, and I do hackathons.</text>

  <!-- $ contributions by year -->
  <text x="24" y="168" class="green f" style="animation-delay:1.95s">$</text>
  <text x="42" y="168" textLength="207" lengthAdjust="spacing">contributions --by-year</text>
  <rect class="cov2" x="42" y="152" width="207" height="22" fill="#0d1117"/>

  <!-- bars: width = count / 833 * 480 -->
  <g class="f" style="animation-delay:3.2s">
    <text x="24" y="200" class="muted">2022</text>
    <text x="24" y="226" class="muted">2023</text>
    <text x="24" y="252" class="muted">2024</text>
    <text x="24" y="278" class="muted">2025</text>
    <text x="24" y="304" class="muted">2026</text>
  </g>
  <rect class="bar" style="animation-delay:3.3s"  x="84" y="189" width="259.3" height="14" rx="3" fill="#26a641"/>
  <rect class="bar" style="animation-delay:3.45s" x="84" y="215" width="111.2" height="14" rx="3" fill="#006d32"/>
  <rect class="bar" style="animation-delay:3.6s"  x="84" y="241" width="28.2"  height="14" rx="3" fill="#0e4429"/>
  <rect class="bar" style="animation-delay:3.75s" x="84" y="267" width="198.8" height="14" rx="3" fill="#26a641"/>
  <rect class="bar" style="animation-delay:3.9s"  x="84" y="293" width="480"   height="14" rx="3" fill="#39d353"/>
  <text x="355.3" y="200" class="f" style="animation-delay:3.9s">450</text>
  <text x="207.2" y="226" class="f" style="animation-delay:4.05s">193</text>
  <text x="124.2" y="252" class="f" style="animation-delay:4.2s">49</text>
  <text x="294.8" y="278" class="f" style="animation-delay:4.35s">345</text>
  <text x="576"   y="304" class="f" style="animation-delay:4.6s"><tspan class="bright">833</tspan><tspan class="muted"> so far</tspan></text>

  <text x="24" y="344" class="f" style="animation-delay:5.1s"><tspan class="bright">1,030</tspan> in the last 12 months <tspan class="muted">·</tspan> best day: <tspan class="bright">135</tspan></text>

  <!-- prompt + cursor -->
  <g class="f" style="animation-delay:5.6s">
    <text x="24" y="386" class="green">$</text>
    <rect class="cur" x="42" y="372" width="9" height="18" fill="#e6edf3"/>
  </g>
</svg>
